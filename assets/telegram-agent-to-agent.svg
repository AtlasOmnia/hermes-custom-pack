<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#ffffff"/>
  <!-- Machine A -->
  <rect x="40" y="60" width="250" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="165" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Machine A</text>
  <text x="165" y="118" text-anchor="middle" font-size="13" fill="#3730a3">Hermes gateway A</text>
  <text x="165" y="140" text-anchor="middle" font-size="13" fill="#3730a3">bot = @Agent_A</text>
  <text x="165" y="162" text-anchor="middle" font-size="12" fill="#4b5563">require_mention: true</text>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="#4b5563">exclusive_bot_mentions: true</text>
  <!-- Machine B -->
  <rect x="430" y="60" width="250" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="555" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">Machine B</text>
  <text x="555" y="118" text-anchor="middle" font-size="13" fill="#047857">Hermes gateway B</text>
  <text x="555" y="140" text-anchor="middle" font-size="13" fill="#047857">bot = @Agent_B</text>
  <text x="555" y="162" text-anchor="middle" font-size="12" fill="#4b5563">require_mention: true</text>
  <text x="555" y="180" text-anchor="middle" font-size="12" fill="#4b5563">exclusive_bot_mentions: true</text>
  <!-- Group -->
  <rect x="210" y="260" width="300" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Telegram group</text>
  <text x="360" y="310" text-anchor="middle" font-size="13" fill="#92400e">@Agent_A · @Agent_B · human</text>
  <!-- Arrows -->
  <line x1="290" y1="135" x2="430" y2="135" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="150" x2="290" y2="150" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="165" y1="210" x2="330" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="210" x2="390" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#6b7280">Every handoff is visible in the group — the transport is the audit log.</text>
</svg>
