<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Health Improvement Loops operating boundary</title>
  <desc id="desc">An operator-selected Hermes home flows to a read-only health audit. An explicit outcome file flows to suggestion-only improvement. Both results may be placed in an optional report for a human review gate. No configuration or scheduler control is shown.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17213a"/>
    </linearGradient>
    <linearGradient id="health" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65d6c4"/>
      <stop offset="1" stop-color="#72a7ff"/>
    </linearGradient>
    <linearGradient id="improvement" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1c75b"/>
      <stop offset="1" stop-color="#ee8d72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-health" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#65d6c4"/>
    </marker>
    <marker id="arrow-improvement" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f1c75b"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b9c6e5"/>
    </marker>
    <style>
      .title { font: 700 52px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7f9ff; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b8c4df; }
      .lane { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .box-title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7f9ff; }
      .body { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c1cce4; }
      .small { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e9f8; }
      .box { fill: #19233d; stroke: #3c4b70; stroke-width: 2; }
      .health-box { fill: #142d39; stroke: #5bc5b8; stroke-width: 2; }
      .improvement-box { fill: #332c25; stroke: #e2b654; stroke-width: 2; }
      .review-box { fill: #252840; stroke: #b9c6e5; stroke-width: 2; }
      .health-line { stroke: #65d6c4; stroke-width: 4; fill: none; marker-end: url(#arrow-health); }
      .improvement-line { stroke: #f1c75b; stroke-width: 4; fill: none; marker-end: url(#arrow-improvement); }
      .neutral-line { stroke: #b9c6e5; stroke-width: 4; fill: none; marker-end: url(#arrow-neutral); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#background)"/>
  <circle cx="1450" cy="110" r="260" fill="#29447e" opacity="0.18"/>
  <circle cx="80" cy="910" r="300" fill="#16766f" opacity="0.12"/>

  <text x="90" y="100" class="title">Health Improvement Loops</text>
  <text x="90" y="143" class="subtitle">Two independent lanes. Bounded evidence. Human review before change.</text>
  <rect x="90" y="172" width="1420" height="4" rx="2" fill="url(#health)"/>

  <text x="90" y="230" class="lane" fill="#65d6c4">HEALTH · READ-ONLY</text>
  <g filter="url(#shadow)">
    <rect x="90" y="265" width="330" height="205" rx="24" class="box"/>
    <text x="130" y="320" class="box-title">Operator-selected home</text>
    <text x="130" y="365" class="body">Explicit Hermes home</text>
    <text x="130" y="397" class="body">Bounded inspection target</text>
    <text x="130" y="440" class="small">No writes to the home</text>
  </g>
  <path d="M430 367 H550" class="health-line"/>
  <g filter="url(#shadow)">
    <rect x="560" y="265" width="390" height="205" rx="24" class="health-box"/>
    <text x="600" y="320" class="box-title">Health audit</text>
    <text x="600" y="365" class="body">Read-only checks</text>
    <text x="600" y="397" class="body">Explicit status per surface</text>
    <text x="600" y="440" class="small">Unknown is not healthy</text>
  </g>
  <path d="M960 367 H1080" class="health-line"/>
  <g filter="url(#shadow)">
    <rect x="1090" y="265" width="420" height="205" rx="24" class="box"/>
    <text x="1130" y="320" class="box-title">Health result</text>
    <text x="1130" y="365" class="body">Observed findings and limits</text>
    <text x="1130" y="397" class="body">Unavailable stays visible</text>
    <text x="1130" y="440" class="small">Evidence for review</text>
  </g>

  <text x="90" y="555" class="lane" fill="#f1c75b">IMPROVEMENT · SUGGESTION ONLY</text>
  <g filter="url(#shadow)">
    <rect x="90" y="590" width="330" height="205" rx="24" class="box"/>
    <text x="130" y="645" class="box-title">Explicit outcome file</text>
    <text x="130" y="690" class="body">One supplied packet</text>
    <text x="130" y="722" class="body">No source discovery</text>
    <text x="130" y="765" class="small">Review sensitivity first</text>
  </g>
  <path d="M430 692 H550" class="improvement-line"/>
  <g filter="url(#shadow)">
    <rect x="560" y="590" width="390" height="205" rx="24" class="improvement-box"/>
    <text x="600" y="645" class="box-title">Improvement evaluation</text>
    <text x="600" y="690" class="body">Redact and apply rubric</text>
    <text x="600" y="722" class="body">Keep evidence bounded</text>
    <text x="600" y="765" class="small">No automatic action</text>
  </g>
  <path d="M960 692 H1080" class="improvement-line"/>
  <g filter="url(#shadow)">
    <rect x="1090" y="590" width="420" height="205" rx="24" class="box"/>
    <text x="1130" y="645" class="box-title">Improvement suggestion</text>
    <text x="1130" y="690" class="body">Hypothesis for a person</text>
    <text x="1130" y="722" class="body">Not an approved change</text>
    <text x="1130" y="765" class="small">Human review required</text>
  </g>

  <path d="M1300 480 V845 H950" class="neutral-line"/>
  <path d="M1300 795 V845 H950" class="neutral-line"/>
  <g filter="url(#shadow)">
    <rect x="560" y="830" width="390" height="105" rx="24" class="review-box"/>
    <text x="600" y="878" class="box-title">Optional report</text>
    <text x="600" y="910" class="body">Independent results, one review view</text>
  </g>
  <path d="M955 882 H1080" class="neutral-line"/>
  <g filter="url(#shadow)">
    <rect x="1090" y="830" width="420" height="105" rx="24" class="review-box"/>
    <text x="1130" y="878" class="box-title">Human review gate</text>
    <text x="1130" y="910" class="body">Reject, defer, investigate, or separately approve</text>
  </g>

  <text x="90" y="955" class="subtitle">No configuration or scheduler control · No credentials · No silent mutation</text>
</svg>
